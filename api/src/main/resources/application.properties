# 어장 추천 서비스 백엔드 설정 — 비밀 값은 ${환경변수} 이름만 적는다 (값은 저장소 맨 위 .env)
spring.application.name=fishreco-api
spring.config.import=optional:file:../.env[.properties]
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# ── DB: app 스키마(Spring 소유) + reco 의 v_svc_* 뷰 읽기 ──────────────
spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${APP_DB_NAME:app}?characterEncoding=UTF-8&useAffectedRows=true&sessionVariables=time_zone='+09:00'
spring.datasource.username=${APP_DB_USER:reco_api}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.time-zone=Asia/Seoul

# ── AI 서버(FastAPI) ─────────────────────────────────────────────
app.ai.base-url=${AI_BASE_URL:http://127.0.0.1:8000}
app.ai.internal-token=${INTERNAL_TOKEN:}
app.ai.timeout-seconds=120

# ── 서비스 ──────────────────────────────────────────────────────
# 시연용 고정 '오늘' (비우면 실제 오늘)
app.demo-today=${DEMO_TODAY:}
# 화면 주소 — 인증 메일 링크 · 로그인 뒤 돌아갈 곳
app.web-base-url=${WEB_BASE_URL:http://localhost:3000}
# 이 이메일(쉼표로 여럿)이 검증되면 ADMIN
app.admin-emails=${ADMIN_EMAILS:}
app.rag.per-minute=${RAG_PER_MINUTE:5}

# ── 메일 (개발 · 수업: Mailpit SMTP 1025 / 웹 8025) ─────────────────
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@fishreco.local}

# ── 소셜 로그인 (키가 비어 있으면 그 버튼은 '설정 안 됨'으로 보인다) ─────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unset}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:unset}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:unset}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

management.endpoints.web.exposure.include=health
logging.level.com.ricerich=INFO
