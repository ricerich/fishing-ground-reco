# 모의 소셜 로그인 — 실제 키 없이 카카오 · 네이버 로그인 · 계정 연결 흐름을 끝까지 돌려 보는 실습 · 캡처용
#   python scripts/mock_oauth.py            (:9100)
#   java -jar ... --spring.profiles.active=demo,mockoauth
# 우리 코드(OAuthHandlers · SocialAccounts)는 그대로 — 바뀌는 것은 제공자 주소와 키뿐이다
spring.security.oauth2.client.registration.kakao.client-id=mock-kakao
spring.security.oauth2.client.registration.kakao.client-secret=mock-secret
spring.security.oauth2.client.provider.kakao.authorization-uri=http://localhost:9100/kakao/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=http://127.0.0.1:9100/kakao/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=http://127.0.0.1:9100/kakao/v2/user/me

spring.security.oauth2.client.registration.naver.client-id=mock-naver
spring.security.oauth2.client.registration.naver.client-secret=mock-secret
spring.security.oauth2.client.provider.naver.authorization-uri=http://localhost:9100/naver/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=http://127.0.0.1:9100/naver/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=http://127.0.0.1:9100/naver/v1/nid/me
